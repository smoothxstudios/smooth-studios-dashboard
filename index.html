<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#101012" />
  <meta name="description" content="A personal welcome to Smooth Studios." />
  <title>Studio A | Smooth Studios</title>
  <link rel="icon" href="logo.png" type="image/png" />
  <link rel="stylesheet" href="style.css?v=2.1.0" />
  <script src="feed-model.js?v=2.1.0" defer></script>
  <script src="script.js?v=2.1.0" defer></script>
</head>
<body>
  <main class="welcome-display" id="welcomeDisplay">
    <div class="studio-art" aria-hidden="true">
      <svg class="orbit-art" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="orbitRed" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#34070c" />
            <stop offset=".33" stop-color="#ae0d1b" />
            <stop offset=".57" stop-color="#ee2337" />
            <stop offset=".76" stop-color="#790815" />
            <stop offset="1" stop-color="#1d070a" />
          </linearGradient>
          <linearGradient id="orbitEdge" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0" stop-color="#72101a" />
            <stop offset=".5" stop-color="#ff6a75" />
            <stop offset="1" stop-color="#d21428" />
          </linearGradient>
          <linearGradient id="orbitShade" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#101012" />
            <stop offset=".4" stop-color="#101012" stop-opacity=".97" />
            <stop offset=".69" stop-color="#101012" stop-opacity=".12" />
            <stop offset="1" stop-color="#101012" stop-opacity="0" />
          </linearGradient>
        </defs>
        <g transform="translate(1672 527) rotate(-26)">
          <circle r="638" fill="none" stroke="#422027" stroke-width="1" />
          <circle r="604" fill="none" stroke="#74303a" stroke-width="1" opacity=".48" />
          <circle r="542" fill="none" stroke="url(#orbitRed)" stroke-width="102" />
          <circle r="593" fill="none" stroke="url(#orbitEdge)" stroke-width="2" opacity=".7" />
          <circle r="490" fill="none" stroke="#ff6976" stroke-width="1.5" opacity=".48" />
          <circle r="468" fill="none" stroke="#740e1a" stroke-width="13" />
          <circle r="430" fill="none" stroke="#68202a" stroke-width="1" />
          <circle r="408" fill="#111113" stroke="#22191d" stroke-width="2" />
          <path d="M -389 -108 A 404 404 0 0 1 219 -339" fill="none" stroke="#ab2333" stroke-width="2" opacity=".65" />
          <path d="M -448 -392 L -466 -408 M 4 -600 L 4 -625 M 426 -424 L 443 -441" stroke="#f6bdc3" stroke-width="2" opacity=".65" />
        </g>
        <path d="M 1600 956 L 1834 956 M 1749 1027 L 1834 1027" stroke="#8c2432" stroke-width="1" opacity=".6" />
        <rect width="1920" height="1080" fill="url(#orbitShade)" />
      </svg>
      <div class="art-baseline"></div>
    </div>

    <header class="display-header">
      <div class="brand-lockup">
        <img class="studio-logo" src="logolong.png" alt="Smooth Studios" width="415" height="107" decoding="async" />
        <span id="previewLabel" class="preview-label" hidden>Preview</span>
      </div>
      <div class="display-clock" aria-label="Current local time in Tallahassee">
        <div class="clock-line"><time id="clockTime">—:—</time><span id="clockPeriod"></span></div>
        <p id="clockDate">Tallahassee, Florida</p>
      </div>
    </header>

    <section class="welcome-heading" aria-labelledby="heroTitle">
      <h1 id="heroTitle" data-personalized="false">
        <span class="hero-intro">Welcome to</span>
        <span id="heroStudio">Smooth Studios</span>
        <span class="hero-guest" id="heroGuest" data-length="short" hidden></span>
      </h1>
      <p id="heroSubtitle">Come with nothing.<br />Leave with everything.</p>
    </section>

    <section class="session-board" id="sessionBoard" aria-label="Your studio session" hidden>
      <div class="room-grid" id="roomGrid" data-layout="single">
        <article class="session-rail" id="studioA" data-state="loading" data-urgent="false" aria-label="Studio A session">
          <div class="session-status"><span class="status-dot" aria-hidden="true"></span><span id="aStatus">Loading schedule</span></div>
          <div class="session-countdown"><p class="detail-label" id="aTimerLabel">Session time</p><p class="timer" id="aTimer">—</p></div>
          <dl class="session-details"><div><dt>Session</dt><dd id="aSession">—</dd></div></dl>
          <dl class="next-session" id="aNextRow" hidden><div><dt id="aNextLabel">Up next</dt><dd id="aNext"></dd></div></dl>
        </article>
        <article class="session-rail" id="studioB" data-state="loading" data-urgent="false" aria-label="Studio B session" hidden>
          <div class="session-status"><span class="status-dot" aria-hidden="true"></span><span id="bStatus">Loading schedule</span></div>
          <div class="session-countdown"><p class="detail-label" id="bTimerLabel">Session time</p><p class="timer" id="bTimer">—</p></div>
          <dl class="session-details"><div><dt>Session</dt><dd id="bSession">—</dd></div></dl>
          <dl class="next-session" id="bNextRow" hidden><div><dt id="bNextLabel">Up next</dt><dd id="bNext"></dd></div></dl>
        </article>
      </div>
    </section>

    <div class="idle-welcome" id="idleWelcome" aria-hidden="true">
      <svg class="signature-mark" viewBox="0 0 116 42" xmlns="http://www.w3.org/2000/svg"><path d="M 4 37 L 25 5 M 37 37 L 58 5 M 70 37 L 91 5" fill="none" stroke="currentColor" stroke-width="6" /><path d="M 98 21 H 116" fill="none" stroke="currentColor" stroke-width="1" /></svg>
      <span class="signature-line"></span>
    </div>
    <span class="visually-hidden" id="connectionStatus" data-state="loading" role="status">Connecting to schedule</span>
  </main>
  <noscript><p class="noscript-message">Welcome to Smooth Studios.</p></noscript>
</body>
</html>
